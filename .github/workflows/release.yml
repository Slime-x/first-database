
name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: myapp-linux-x86_64
            output: dist/myapp

          - os: windows-latest
            artifact: myapp-windows-x86_64
            output: dist/myapp.exe

          - os: macos-latest
            artifact: myapp-macos
            output: dist/myapp

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build executable
        run: python -m PyInstaller --clean --onefile --name myapp app.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Show downloaded files
        run: find release-assets -type f -print

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: false
          body: |
            ## Downloads

            - **Linux:** `myapp-linux-x86_64`
            - **Windows:** `myapp-windows-x86_64.exe`
            - **macOS:** `myapp-macos`

            Download the executable for your operating system.
          files: |
            release-assets/myapp-linux-x86_64/*
            release-assets/myapp-windows-x86_64/*
            release-assets/myapp-macos/*
